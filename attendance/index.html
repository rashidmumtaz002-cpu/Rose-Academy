<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Attendance Register</title>
    <style>
      :root {
        --bg: #f2f5f2;
        --surface: #ffffff;
        --surface-2: #eef1ee;
        --ink: #1b2420;
        --muted: #5d6a62;
        --line: #d8ded8;
        --accent: #1e6b4f;
        --accent-strong: #15573e;
        --accent-soft: #e2efe8;
        --p-bg: #dff0e3; --p-ink: #1d6b3c;
        --a-bg: #fbe3df; --a-ink: #a83226;
        --l-bg: #fbf0cd; --l-ink: #8a610d;
        --danger: #b3372f;
        --shadow: 0 1px 2px rgba(20, 40, 30, .06), 0 4px 14px rgba(20, 40, 30, .05);
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --surface: #1b201d;
          --surface-2: #232926;
          --ink: #e7ede8;
          --muted: #9daba2;
          --line: #333b36;
          --accent: #3fae7d;
          --accent-strong: #57c08f;
          --accent-soft: #22362c;
          --p-bg: #1f3a29; --p-ink: #7fd6a0;
          --a-bg: #40241f; --a-ink: #f09a8d;
          --l-bg: #3d3319; --l-ink: #ecc96e;
          --danger: #e07a6f;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }
      button, select, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button, select, input[type="date"], input[type="month"], input[type="number"], input[type="text"] { min-height: 2.5rem; }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 64px; }

      /* Register head — mirrors the paper register */
      .reg-head { text-align: center; padding: 10px 0 4px; }
      .reg-head .inst {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.15rem, 3.4vw, 1.6rem);
        font-weight: 700;
        letter-spacing: .01em;
      }
      .reg-head .title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1rem, 2.8vw, 1.25rem);
        letter-spacing: .35em;
        text-indent: .35em;
        color: var(--accent);
        font-weight: 700;
        margin-top: 2px;
        text-transform: uppercase;
      }
      .meta-line {
        display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
        margin-top: 10px; color: var(--muted); font-size: .95rem;
      }
      .meta-line b { color: var(--ink); font-weight: 600; }
      .reg-switch { display: flex; justify-content: center; margin-top: 12px; }
      .reg-switch[hidden] { display: none; }
      .reg-switch select {
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 10px; max-width: 100%;
      }

      /* Backup bar */
      .backup-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 10px 14px; margin-top: 16px;
      }
      .backup-bar .lbl { font-weight: 700; }
      .backup-bar .hint { color: var(--muted); font-size: .9rem; flex: 1 1 180px; }
      .btn {
        border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
        border-radius: 8px; padding: 8px 16px; font-weight: 600; min-height: 2.75rem;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-strong); }
      @media (prefers-color-scheme: dark) { .btn.primary { color: #0d1512; } }
      .btn.danger { color: var(--danger); }
      .btn.small { min-height: 2.25rem; padding: 4px 12px; font-size: .92rem; }

      /* Tabs */
      .tabs { display: flex; gap: 6px; margin-top: 18px; border-bottom: 2px solid var(--line); }
      .tabs button {
        border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted);
        border-bottom: 3px solid transparent; margin-bottom: -2px; min-height: 2.75rem;
      }
      .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
      .view { display: none; padding-top: 18px; }
      .view.active { display: block; }

      /* Toolbar rows */
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
      .toolbar .spacer { flex: 1; }
      .nav-btn {
        width: 2.75rem; height: 2.75rem; border-radius: 8px; border: 1px solid var(--line);
        background: var(--surface); font-size: 1.15rem; line-height: 1; flex: 0 0 auto;
      }
      .nav-btn:hover { border-color: var(--accent); }
      input[type="date"], input[type="month"] {
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      }
      .counts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .chip {
        border-radius: 999px; padding: 5px 12px; font-size: .9rem; font-weight: 600;
        background: var(--surface-2); border: 1px solid var(--line);
      }
      .chip.p { background: var(--p-bg); color: var(--p-ink); border-color: transparent; }
      .chip.a { background: var(--a-bg); color: var(--a-ink); border-color: transparent; }
      .chip.l { background: var(--l-bg); color: var(--l-ink); border-color: transparent; }

      /* Mark list */
      .mark-list { display: flex; flex-direction: column; gap: 8px; }
      .mark-row {
        display: flex; align-items: center; gap: 12px;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 8px 12px; box-shadow: var(--shadow);
      }
      .mark-row .sr { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
      .mark-row .nm { flex: 1 1 auto; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: 0 0 auto; }
      .seg button {
        width: 3rem; height: 2.75rem; border: 0; background: var(--surface); font-weight: 700;
        border-right: 1px solid var(--line);
      }
      .seg button:last-child { border-right: 0; }
      .seg button.on[data-v="P"] { background: var(--p-bg); color: var(--p-ink); }
      .seg button.on[data-v="A"] { background: var(--a-bg); color: var(--a-ink); }
      .seg button.on[data-v="L"] { background: var(--l-bg); color: var(--l-ink); }
      @media (max-width: 480px) {
        .mark-row { flex-wrap: wrap; }
        .mark-row .nm { flex: 1 1 calc(100% - 3.5rem); }
        .mark-row .seg { margin-left: auto; }
      }

      /* Monthly table (wide screens) */
      .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
      table.reg { border-collapse: collapse; width: 100%; font-size: .82rem; }
      table.reg th, table.reg td { border: 1px solid var(--line); padding: 4px 3px; text-align: center; font-variant-numeric: tabular-nums; }
      table.reg th { background: var(--surface-2); font-weight: 700; }
      table.reg th.nm, table.reg td.nm { text-align: left; padding-left: 8px; min-width: 130px; font-size: .9rem; }
      table.reg td.m-p { background: var(--p-bg); color: var(--p-ink); font-weight: 700; }
      table.reg td.m-a { background: var(--a-bg); color: var(--a-ink); font-weight: 700; }
      table.reg td.m-l { background: var(--l-bg); color: var(--l-ink); font-weight: 700; }
      table.reg td.tot, table.reg th.tot { background: var(--accent-soft); font-weight: 700; }
      .lectures-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
      .lectures-row input[type="number"] {
        width: 5.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      }
      .month-cards { display: none; }
      @media (max-width: 820px) {
        .table-scroll { display: none; }
        .month-cards { display: flex; flex-direction: column; gap: 10px; }
      }
      .m-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
      .m-card .top { display: flex; align-items: baseline; gap: 10px; }
      .m-card .top .sr { color: var(--muted); font-variant-numeric: tabular-nums; }
      .m-card .top .nm { font-weight: 700; flex: 1; }
      .m-card .top .pct { font-weight: 700; color: var(--accent); }
      .m-card .stats { color: var(--muted); font-size: .92rem; margin-top: 2px; }
      .day-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
      .day-chips span {
        min-width: 2rem; text-align: center; border-radius: 6px; padding: 3px 4px;
        font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .day-chips span.p { background: var(--p-bg); color: var(--p-ink); }
      .day-chips span.a { background: var(--a-bg); color: var(--a-ink); }
      .day-chips span.l { background: var(--l-bg); color: var(--l-ink); }

      /* Students / settings */
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
      .panel h2 { font-size: 1.05rem; margin: 0 0 12px; }
      .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .field label { display: block; font-size: .88rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
      .field input {
        width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      }
      .stu-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .stu-row:last-child { border-bottom: 0; }
      .stu-row input.sr-in { width: 4.5rem; flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: center; }
      .stu-row input.nm-in { flex: 1 1 auto; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
      .icon-btn {
        flex: 0 0 auto; width: 2.75rem; height: 2.75rem; border-radius: 8px; border: 1px solid var(--line);
        background: var(--surface); color: var(--danger); font-size: 1.05rem;
      }
      .add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .add-row input.sr-in { width: 5.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: center; }
      .add-row input.nm-in { flex: 1 1 180px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
      .empty-note { color: var(--muted); text-align: center; padding: 22px 10px; }

      /* Modal + toast */
      .overlay {
        position: fixed; inset: 0; background: rgba(10, 15, 12, .5);
        display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
      }
      .overlay.open { display: flex; }
      .modal { background: var(--surface); border-radius: 14px; padding: 22px; max-width: 420px; width: 100%; box-shadow: var(--shadow); }
      .modal p { margin: 0 0 18px; }
      .modal .row { display: flex; gap: 10px; justify-content: flex-end; }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
        font-weight: 600; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
        max-width: calc(100vw - 32px); text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="reg-head">
        <div class="inst" id="headInst">Govt. Associate College Tibba Sultan Pur, Tehsil Mailsi</div>
        <div class="title">Attendance Register</div>
        <div class="meta-line" id="headMeta"></div>
        <div class="reg-switch" id="regSwitchWrap" hidden>
          <label class="sr-only" for="regSwitch" style="position:absolute;left:-9999px">Choose register</label>
          <select id="regSwitch" aria-label="Choose register"></select>
        </div>
      </header>

      <div class="backup-bar">
        <span class="lbl">Backup</span>
        <span class="hint">Download the full register — every month, every student.</span>
        <button class="btn primary" id="btnExcel" type="button">Download Excel</button>
        <button class="btn" id="btnPdf" type="button">Download PDF</button>
      </div>

      <nav class="tabs" role="tablist" aria-label="Register views">
        <button type="button" role="tab" id="tab-mark" aria-selected="true" data-view="mark">Mark Attendance</button>
        <button type="button" role="tab" id="tab-month" aria-selected="false" data-view="month">Monthly Register</button>
        <button type="button" role="tab" id="tab-students" aria-selected="false" data-view="students">Students</button>
      </nav>

      <!-- MARK ATTENDANCE -->
      <section class="view active" id="view-mark" role="tabpanel" aria-labelledby="tab-mark">
        <div class="toolbar">
          <button class="nav-btn" id="dayPrev" type="button" aria-label="Previous day">&#8249;</button>
          <input type="date" id="markDate" aria-label="Date" />
          <button class="nav-btn" id="dayNext" type="button" aria-label="Next day">&#8250;</button>
          <button class="btn small" id="btnToday" type="button">Today</button>
          <span class="spacer"></span>
          <button class="btn small" id="btnAllPresent" type="button">Mark all present</button>
          <button class="btn small danger" id="btnClearDay" type="button">Clear day</button>
        </div>
        <div class="counts" id="markCounts"></div>
        <div class="mark-list" id="markList"></div>
      </section>

      <!-- MONTHLY REGISTER -->
      <section class="view" id="view-month" role="tabpanel" aria-labelledby="tab-month">
        <div class="toolbar">
          <button class="nav-btn" id="monPrev" type="button" aria-label="Previous month">&#8249;</button>
          <input type="month" id="monthPick" aria-label="Month" />
          <button class="nav-btn" id="monNext" type="button" aria-label="Next month">&#8250;</button>
        </div>
        <div class="lectures-row">
          <label for="lecturesIn"><b>Lectures delivered this month:</b></label>
          <input type="number" id="lecturesIn" min="0" step="1" inputmode="numeric" />
          <span class="chip p" id="monthSummary"></span>
        </div>
        <div class="table-scroll" id="monthTableWrap"></div>
        <div class="month-cards" id="monthCards"></div>
      </section>

      <!-- STUDENTS -->
      <section class="view" id="view-students" role="tabpanel" aria-labelledby="tab-students">
        <div class="panel">
          <h2>Register details</h2>
          <div class="field-grid">
            <div class="field"><label for="fInst">Institution</label><input type="text" id="fInst" /></div>
            <div class="field"><label for="fClass">Class</label><input type="text" id="fClass" /></div>
            <div class="field"><label for="fSession">Session / Section</label><input type="text" id="fSession" /></div>
            <div class="field"><label for="fSubject">Subject</label><input type="text" id="fSubject" /></div>
            <div class="field"><label for="fTeacher">Teacher</label><input type="text" id="fTeacher" /></div>
          </div>
          <div class="add-row">
            <button class="btn" id="btnNewReg" type="button">New register (another class)</button>
            <button class="btn danger" id="btnDelReg" type="button">Delete this register</button>
          </div>
        </div>
        <div class="panel">
          <h2>Students (<span id="stuCount">0</span>)</h2>
          <div id="stuList"></div>
          <form class="add-row" id="addStuForm">
            <input class="sr-in" type="number" id="addSr" placeholder="Sr." aria-label="Serial number" inputmode="numeric" />
            <input class="nm-in" type="text" id="addName" placeholder="Student name" aria-label="Student name" />
            <button class="btn primary" type="submit">Add student</button>
          </form>
        </div>
      </section>
    </main>

    <div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true">
      <div class="modal">
        <p id="confirmText"></p>
        <div class="row">
          <button class="btn" id="confirmCancel" type="button">Cancel</button>
          <button class="btn primary" id="confirmOk" type="button">Yes</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>

        '2026-11-21': { '32': 'P', '33': 'P', '34': 'P', '35': 'A', '36': 'A', '37': 'P', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P' },
        '2026-11-23': { '32': 'P', '33': 'P', '34': 'P', '35': 'A', '36': 'A', '37': 'P', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'A', '44': 'P', '45': 'P' },
        '2026-11-24': { '32': 'P', '33': 'P', '34': 'P', '35': 'A', '36': 'P', '37': 'P', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P', '45': 'P' },
        '2026-11-25': { '32': 'P', '33': 'P', '34': 'P', '35': 'A', '36': 'P', '37': 'P', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P', '45': 'P' },
        '2026-11-26': { '32': 'P', '33': 'P', '34': 'A', '35': 'A', '36': 'P', '37': 'A', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P', '45': 'P' },
        '2026-11-27': { '32': 'P', '33': 'P', '34': 'A', '35': 'A', '36': 'P', '37': 'A', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P', '45': 'P' },
        '2026-11-28': { '32': 'P', '33': 'P', '34': 'P', '35': 'A', '36': 'P', '37': 'P', '38': 'A', '39': 'P', '40': 'P', '41': 'P', '42': 'A', '43': 'P', '44': 'P', '45': 'P' },
        '2026-11-29': { '32': 'P', '33': 'P', '39': 'P', '40': 'P', '41': 'A', '42': 'A', '43': 'A', '44': 'A', '45': 'P' }
      };

      var seq = 1;
      function nid() { return 'x' + Date.now().toString(36) + (seq++); }

      function seedRegister2() {
        var idMap = {};   // live-app numeric student id -> generated id
        var students = SEED2_STUDENTS.map(function (s) {
          var id = nid();
          idMap[s[0]] = id;
          return { id: id, sr: s[1], name: s[2] };
        });
        var marks = {};
        Object.keys(SEED2_MARKS).forEach(function (ds) {
          var day = {};
          Object.keys(SEED2_MARKS[ds]).forEach(function (sid) { day[idMap[sid]] = SEED2_MARKS[ds][sid]; });
          marks[ds] = day;
        });
        return {
          id: nid(),
          institution: 'Govt. Associate College Tibba Sultan Pur, Tehsil Mailsi',
          className: '2nd Year', session: 'ICS', subject: 'Maths', teacher: 'Aamir Khan',
          students: students,
          marks: marks,
          lectures: {}
        };
      }

      function seedState() {
        var reg = {
          id: nid(),
          institution: 'Govt. Associate College Tibba Sultan Pur, Tehsil Mailsi',
          className: '1st Year', session: 'ICS', subject: 'Maths', teacher: 'Aamir Khan',
          students: SEED_STUDENTS.map(function (s) { return { id: nid(), sr: s[0], name: s[1] }; }),
          marks: {},        // { 'YYYY-MM-DD': { studentId: 'P'|'A'|'L' } }
          lectures: {}      // { 'YYYY-MM': number }
        };
        return { activeId: reg.id, registers: [reg, seedRegister2()] };
      }

      var state;
      try {
        var raw = localStorage.getItem(LS_KEY);
        state = raw ? JSON.parse(raw) : seedState();
        if (!state || !state.registers || !state.registers.length) state = seedState();
      } catch (e) { state = seedState(); }

      // Migration: a browser that saved data before the 2nd Year register
      // existed gets it appended — stored registers and marks are never
      // reset, replaced or reordered, and register 2 is never duplicated.
      var hasSecond = false;
      state.registers.forEach(function (r) { if (r.className === '2nd Year') hasSecond = true; });
      if (!hasSecond) state.registers.push(seedRegister2());

      function save() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked: keep working in memory */ }
      }
      save();

      function reg() {
        for (var i = 0; i < state.registers.length; i++) if (state.registers[i].id === state.activeId) return state.registers[i];
        state.activeId = state.registers[0].id;
        return state.registers[0];
      }
      function sortedStudents(r) {
        return r.students.slice().sort(function (a, b) { return (a.sr - b.sr) || a.name.localeCompare(b.name); });
      }

      /* ---------- date helpers ---------- */
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function monthOf(dateStr) { return dateStr.slice(0, 7); }
      function daysInMonth(ym) {
        var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
        return new Date(y, m, 0).getDate();
      }
      function shiftMonth(ym, delta) {
        var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + delta;
        var d = new Date(y, m, 1);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1);
      }
      function shiftDay(dateStr, delta) {
        var p = dateStr.split('-');
        var d = new Date(+p[0], +p[1] - 1, +p[2] + delta);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      function monthLabel(ym) { return MONTH_NAMES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      /* ---------- attendance maths ---------- */
      function monthCounts(r, ym) {
        // returns { studentId: {P,A,L} }
        var out = {};
        sortedStudents(r).forEach(function (s) { out[s.id] = { P: 0, A: 0, L: 0 }; });
        Object.keys(r.marks).forEach(function (ds) {
          if (monthOf(ds) !== ym) return;
          var day = r.marks[ds];
          Object.keys(day).forEach(function (sid) { if (out[sid] && day[sid]) out[sid][day[sid]]++; });
        });
        return out;
      }
      function presentBefore(r, ym, sid) {
        // total P in all months strictly before ym
        var total = 0;
        Object.keys(r.marks).forEach(function (ds) {
          if (monthOf(ds) < ym && r.marks[ds][sid] === 'P') total++;
        });
        return total;
      }
      function markedDatesInMonth(r, ym) {
        return Object.keys(r.marks).filter(function (ds) {
          return monthOf(ds) === ym && Object.keys(r.marks[ds]).length > 0;
        }).sort();
      }
      function allMonths(r) {
        var set = {};
        Object.keys(r.marks).forEach(function (ds) { if (Object.keys(r.marks[ds]).length) set[monthOf(ds)] = 1; });
        Object.keys(r.lectures).forEach(function (ym) { if (r.lectures[ym]) set[ym] = 1; });
        var list = Object.keys(set).sort();
        return list.length ? list : [monthOf(todayStr())];
      }
      function pctOf(p, total) { return total > 0 ? Math.round((p / total) * 100) : null; }

      /* ---------- UI state ---------- */
      var curDate = todayStr();
      var curMonth = monthOf(todayStr());
      var toastTimer = null;
      function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
      }
      var confirmCb = null;
      function askConfirm(msg, cb) {
        document.getElementById('confirmText').textContent = msg;
        document.getElementById('confirmOverlay').classList.add('open');
        confirmCb = cb;
      }
      document.getElementById('confirmCancel').addEventListener('click', function () {
        document.getElementById('confirmOverlay').classList.remove('open'); confirmCb = null;
      });
      document.getElementById('confirmOk').addEventListener('click', function () {
        document.getElementById('confirmOverlay').classList.remove('open');
        if (confirmCb) { var cb = confirmCb; confirmCb = null; cb(); }
      });

      /* ---------- header ---------- */
      function renderHeader() {
        var r = reg();
        document.getElementById('headInst').textContent = r.institution || '—';
        document.getElementById('headMeta').innerHTML =
          '<span>Class: <b>' + esc(r.className) + '</b></span>' +
          '<span>Session: <b>' + esc(r.session) + '</b></span>' +
          '<span>Subject: <b>' + esc(r.subject) + '</b></span>' +
          '<span>Teacher: <b>' + esc(r.teacher) + '</b></span>';
        var wrap = document.getElementById('regSwitchWrap');
        var sel = document.getElementById('regSwitch');
        if (state.registers.length > 1) {
          wrap.hidden = false;
          sel.innerHTML = state.registers.map(function (x) {
            return '<option value="' + x.id + '"' + (x.id === state.activeId ? ' selected' : '') + '>' +
              esc([x.className, x.session, x.subject].filter(Boolean).join(' · ') || 'Register') + '</option>';
          }).join('');
        } else { wrap.hidden = true; }
      }
      document.getElementById('regSwitch').addEventListener('change', function () {
        state.activeId = this.value; save(); renderAll();
      });

      /* ---------- tabs ---------- */
      var tabBtns = Array.prototype.slice.call(document.querySelectorAll('.tabs button'));
      tabBtns.forEach(function (b) {
        b.addEventListener('click', function () {
          tabBtns.forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
          ['mark', 'month', 'students'].forEach(function (v) {
            document.getElementById('view-' + v).classList.toggle('active', v === b.getAttribute('data-view'));
          });
          var v = b.getAttribute('data-view');
          if (v === 'mark') renderMark();
          else if (v === 'month') renderMonth();
          else renderStudents();
        });
      });

      /* ---------- mark view ---------- */
      var markDateIn = document.getElementById('markDate');
      markDateIn.value = curDate;
      markDateIn.addEventListener('change', function () { if (this.value) { curDate = this.value; renderMark(); } });
      document.getElementById('dayPrev').addEventListener('click', function () { curDate = shiftDay(curDate, -1); markDateIn.value = curDate; renderMark(); });
      document.getElementById('dayNext').addEventListener('click', function () { curDate = shiftDay(curDate, 1); markDateIn.value = curDate; renderMark(); });
      document.getElementById('btnToday').addEventListener('click', function () { curDate = todayStr(); markDateIn.value = curDate; renderMark(); });
      document.getElementById('btnAllPresent').addEventListener('click', function () {
        var r = reg();
        if (!r.marks[curDate]) r.marks[curDate] = {};
        sortedStudents(r).forEach(function (s) { r.marks[curDate][s.id] = 'P'; });
        save(); renderMark(); toast('All marked present — ' + curDate);
      });
      document.getElementById('btnClearDay').addEventListener('click', function () {
        var r = reg();
        if (!r.marks[curDate] || !Object.keys(r.marks[curDate]).length) { toast('Nothing marked on this day'); return; }
        askConfirm('Clear all attendance marks for ' + curDate + '?', function () {
          delete r.marks[curDate]; save(); renderMark(); toast('Day cleared');
        });
      });

      function renderMark() {
        var r = reg();
        var day = r.marks[curDate] || {};
        var students = sortedStudents(r);
        var c = { P: 0, A: 0, L: 0 };
        students.forEach(function (s) { if (day[s.id]) c[day[s.id]]++; });
        var unmarked = students.length - c.P - c.A - c.L;
        document.getElementById('markCounts').innerHTML =
          '<span class="chip p">Present: ' + c.P + '</span>' +
          '<span class="chip a">Absent: ' + c.A + '</span>' +
          '<span class="chip l">Leave: ' + c.L + '</span>' +
          '<span class="chip">Not marked: ' + unmarked + '</span>';
        var list = document.getElementById('markList');
        if (!students.length) { list.innerHTML = '<div class="empty-note">No students yet — add them in the Students tab.</div>'; return; }
        list.innerHTML = students.map(function (s) {
          var v = day[s.id] || '';
          return '<div class="mark-row">' +
            '<span class="sr">' + s.sr + '</span>' +
            '<span class="nm">' + esc(s.name) + '</span>' +
            '<span class="seg" role="group" aria-label="Attendance for ' + esc(s.name) + '">' +
            ['P', 'A', 'L'].map(function (x) {
              return '<button type="button" data-sid="' + s.id + '" data-v="' + x + '"' + (v === x ? ' class="on"' : '') + ' aria-pressed="' + (v === x) + '">' + x + '</button>';
            }).join('') +
            '</span></div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('.seg button'), function (b) {
          b.addEventListener('click', function () {
            var r2 = reg();
            if (!r2.marks[curDate]) r2.marks[curDate] = {};
            var sid = b.getAttribute('data-sid'), v = b.getAttribute('data-v');
            if (r2.marks[curDate][sid] === v) delete r2.marks[curDate][sid];
            else r2.marks[curDate][sid] = v;
            if (!Object.keys(r2.marks[curDate]).length) delete r2.marks[curDate];
            save(); renderMark();
          });
        });
      }

      /* ---------- month view ---------- */
      var monthPick = document.getElementById('monthPick');
      monthPick.value = curMonth;
      monthPick.addEventListener('change', function () { if (this.value) { curMonth = this.value; renderMonth(); } });
      document.getElementById('monPrev').addEventListener('click', function () { curMonth = shiftMonth(curMonth, -1); monthPick.value = curMonth; renderMonth(); });
      document.getElementById('monNext').addEventListener('click', function () { curMonth = shiftMonth(curMonth, 1); monthPick.value = curMonth; renderMonth(); });
      document.getElementById('lecturesIn').addEventListener('change', function () {
        var r = reg();
        var n = parseInt(this.value, 10);
        if (isNaN(n) || n <= 0) delete r.lectures[curMonth]; else r.lectures[curMonth] = n;
        save(); renderMonth();
      });

      function renderMonth() {
        var r = reg();
        var students = sortedStudents(r);
        var counts = monthCounts(r, curMonth);
        var dates = markedDatesInMonth(r, curMonth);
        var lec = r.lectures[curMonth] || 0;
        document.getElementById('lecturesIn').value = lec ? lec : '';
        var totP = 0, totA = 0, totL = 0;
        students.forEach(function (s) { totP += counts[s.id].P; totA += counts[s.id].A; totL += counts[s.id].L; });
        document.getElementById('monthSummary').textContent =
          monthLabel(curMonth) + ' · Days marked: ' + dates.length + ' · P ' + totP + ' · A ' + totA + ' · L ' + totL;

        var dim = daysInMonth(curMonth);
        // desktop table
        var head = '<tr><th>Sr.</th><th class="nm">Name of Student</th>';
        for (var d = 1; d <= dim; d++) head += '<th>' + d + '</th>';
        head += '<th class="tot">P</th><th class="tot">A</th><th class="tot">L</th><th class="tot">Prev P</th><th class="tot">Total P</th><th class="tot">%</th></tr>';
        var body = students.map(function (s) {
          var c = counts[s.id];
          var prev = presentBefore(r, curMonth, s.id);
          var total = c.P + c.A + c.L;
          var pct = pctOf(c.P, total);
          var row = '<tr><td>' + s.sr + '</td><td class="nm">' + esc(s.name) + '</td>';
          for (var d2 = 1; d2 <= dim; d2++) {
            var ds = curMonth + '-' + pad(d2);
            var v = (r.marks[ds] || {})[s.id] || '';
            row += '<td' + (v ? ' class="m-' + v.toLowerCase() + '"' : '') + '>' + v + '</td>';
          }
          row += '<td class="tot">' + c.P + '</td><td class="tot">' + c.A + '</td><td class="tot">' + c.L + '</td>' +
            '<td class="tot">' + prev + '</td><td class="tot">' + (prev + c.P) + '</td>' +
            '<td class="tot">' + (pct === null ? '—' : pct + '%') + '</td></tr>';
          return row;
        }).join('');
        document.getElementById('monthTableWrap').innerHTML =
          students.length ? '<table class="reg"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>'
                          : '<div class="empty-note">No students yet — add them in the Students tab.</div>';

        // phone cards
        document.getElementById('monthCards').innerHTML = students.map(function (s) {
          var c = counts[s.id];
          var prev = presentBefore(r, curMonth, s.id);
          var total = c.P + c.A + c.L;
          var pct = pctOf(c.P, total);
          var chips = '';
          for (var d3 = 1; d3 <= dim; d3++) {
            var ds3 = curMonth + '-' + pad(d3);
            var v3 = (r.marks[ds3] || {})[s.id] || '';
            chips += '<span' + (v3 ? ' class="' + v3.toLowerCase() + '"' : '') + '>' + d3 + (v3 ? ' ' + v3 : '') + '</span>';
          }
          return '<div class="m-card"><div class="top"><span class="sr">' + s.sr + '</span>' +
            '<span class="nm">' + esc(s.name) + '</span>' +
            '<span class="pct">' + (pct === null ? '—' : pct + '%') + '</span></div>' +
            '<div class="stats">Present ' + c.P + ' · Absent ' + c.A + ' · Leave ' + c.L +
            ' · Previous present ' + prev + ' · Total present ' + (prev + c.P) + '</div>' +
            '<div class="day-chips">' + chips + '</div></div>';
        }).join('');
      }

      /* ---------- students view ---------- */
      var detailFields = { fInst: 'institution', fClass: 'className', fSession: 'session', fSubject: 'subject', fTeacher: 'teacher' };
      Object.keys(detailFields).forEach(function (fid) {
        document.getElementById(fid).addEventListener('change', function () {
          var r = reg();
          r[detailFields[fid]] = this.value.trim();
          save(); renderHeader(); toast('Register details saved');
        });
      });
      document.getElementById('btnNewReg').addEventListener('click', function () {
        var r = reg();
        var nr = {
          id: nid(), institution: r.institution, className: '', session: '', subject: '', teacher: r.teacher,
          students: [], marks: {}, lectures: {}
        };
        state.registers.push(nr);
        state.activeId = nr.id;
        save(); renderAll(); toast('New register created — fill in its details and students');
      });
      document.getElementById('btnDelReg').addEventListener('click', function () {
        if (state.registers.length <= 1) { toast('This is the only register — it cannot be deleted'); return; }
        var r = reg();
        askConfirm('Delete the register for "' + ([r.className, r.session, r.subject].filter(Boolean).join(' · ') || 'this class') + '" with all its attendance?', function () {
          state.registers = state.registers.filter(function (x) { return x.id !== r.id; });
          state.activeId = state.registers[0].id;
          save(); renderAll(); toast('Register deleted');
        });
      });
      document.getElementById('addStuForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var r = reg();
        var name = document.getElementById('addName').value.trim();
        var sr = parseInt(document.getElementById('addSr').value, 10);
        if (!name) { toast('Write the student name first'); return; }
        if (isNaN(sr)) {
          var max = 0;
          r.students.forEach(function (s) { if (s.sr > max) max = s.sr; });
          sr = max + 1;
        }
        r.students.push({ id: nid(), sr: sr, name: name });
        save();
        document.getElementById('addName').value = '';
        document.getElementById('addSr').value = '';
        renderStudents(); renderMark(); renderMonth();
        toast('Student added');
      });

      function renderStudents() {
        var r = reg();
        Object.keys(detailFields).forEach(function (fid) {
          document.getElementById(fid).value = r[detailFields[fid]] || '';
        });
        var students = sortedStudents(r);
        document.getElementById('stuCount').textContent = students.length;
        var list = document.getElementById('stuList');
        if (!students.length) { list.innerHTML = '<div class="empty-note">No students in this register yet.</div>'; return; }
        list.innerHTML = students.map(function (s) {
          return '<div class="stu-row">' +
            '<input class="sr-in" type="number" inputmode="numeric" value="' + s.sr + '" data-sid="' + s.id + '" data-k="sr" aria-label="Serial number for ' + esc(s.name) + '" />' +
            '<input class="nm-in" type="text" value="' + esc(s.name) + '" data-sid="' + s.id + '" data-k="name" aria-label="Name" />' +
            '<button class="icon-btn" type="button" data-del="' + s.id + '" aria-label="Remove ' + esc(s.name) + '">&#10005;</button>' +
            '</div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('input'), function (inp) {
          inp.addEventListener('change', function () {
            var r2 = reg();
            var stu = null;
            r2.students.forEach(function (x) { if (x.id === inp.getAttribute('data-sid')) stu = x; });
            if (!stu) return;
            if (inp.getAttribute('data-k') === 'sr') {
              var n = parseInt(inp.value, 10);
              if (!isNaN(n)) stu.sr = n;
            } else {
              var nm = inp.value.trim();
              if (nm) stu.name = nm;
            }
            save(); renderStudents(); renderHeader();
          });
        });
        Array.prototype.forEach.call(list.querySelectorAll('[data-del]'), function (b) {
          b.addEventListener('click', function () {
            var r2 = reg();
            var stu = null;
            r2.students.forEach(function (x) { if (x.id === b.getAttribute('data-del')) stu = x; });
            if (!stu) return;
            askConfirm('Remove ' + stu.name + ' (Sr. ' + stu.sr + ') from the register? Their attendance marks will also be removed.', function () {
              r2.students = r2.students.filter(function (x) { return x.id !== stu.id; });
              Object.keys(r2.marks).forEach(function (ds) { delete r2.marks[ds][stu.id]; });
              save(); renderStudents(); renderMark(); renderMonth(); toast('Student removed');
            });
          });
        });
      }

      /* ---------- backup ---------- */
      function registerDoc(r, forPrint) {
        var students = sortedStudents(r);
        var months = allMonths(r);
        var totalMarks = 0, totalLectures = 0;
        Object.keys(r.marks).forEach(function (ds) { totalMarks += Object.keys(r.marks[ds]).length; });
        months.forEach(function (ym) { totalLectures += (r.lectures[ym] || 0); });
        var css =
          'body{font-family:Arial,sans-serif;color:#111}h1{font-size:17px;text-align:center;margin:2px 0}' +
          'h2{font-size:14px;text-align:center;letter-spacing:3px;margin:2px 0 10px}' +
          'h3{font-size:13px;margin:18px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:8px}' +
          'td,th{border:1px solid #888;padding:3px 5px;font-size:11px;text-align:center}' +
          'td.nm,th.nm{text-align:left}.meta td{border:0;text-align:left;font-size:12px;padding:2px 6px 2px 0}' +
          '.p{background:#dff0e3}.a{background:#fbe3df}.l{background:#fbf0cd}.tot{background:#eef3ee;font-weight:bold}' +
          (forPrint ? '@page{size:A4 landscape;margin:10mm}' : '');
        var html = '<!doctype html><html><head><meta charset="utf-8"><title>Attendance Register Backup</title><style>' + css + '</style></head><body>';
        html += '<h1>' + esc(r.institution) + '</h1><h2>ATTENDANCE REGISTER</h2>';
        html += '<table class="meta"><tr><td><b>Class:</b> ' + esc(r.className) + '</td><td><b>Session:</b> ' + esc(r.session) +
          '</td><td><b>Subject:</b> ' + esc(r.subject) + '</td><td><b>Teacher:</b> ' + esc(r.teacher) + '</td></tr>' +
          '<tr><td><b>Students:</b> ' + students.length + '</td><td><b>Months:</b> ' +
          (months.length ? months.map(monthLabel).join(', ') : '—') + '</td>' +
          '<td><b>Total lectures:</b> ' + totalLectures + '</td><td><b>Total marks recorded:</b> ' + totalMarks + '</td></tr></table>';

        months.forEach(function (ym) {
          var counts = monthCounts(r, ym);
          var dim = daysInMonth(ym);
          html += '<h3>' + monthLabel(ym) + ' — Lectures delivered: ' + (r.lectures[ym] || 0) + '</h3>';
          html += '<table><tr><th>Sr. No.</th><th class="nm">Name of Student</th>';
          for (var d = 1; d <= dim; d++) html += '<th>' + d + '</th>';
          html += '<th>Present</th><th>Absent</th><th>Leave</th><th>Prev Present</th><th>Total Present</th><th>%</th></tr>';
          students.forEach(function (s) {
            var c = counts[s.id];
            var prev = presentBefore(r, ym, s.id);
            var tot = c.P + c.A + c.L;
            var pct = pctOf(c.P, tot);
            html += '<tr><td>' + s.sr + '</td><td class="nm">' + esc(s.name) + '</td>';
            for (var d2 = 1; d2 <= dim; d2++) {
              var v = (r.marks[ym + '-' + pad(d2)] || {})[s.id] || '';
              html += '<td' + (v ? ' class="' + v.toLowerCase() + '"' : '') + '>' + v + '</td>';
            }
            html += '<td class="tot">' + c.P + '</td><td class="tot">' + c.A + '</td><td class="tot">' + c.L + '</td>' +
              '<td class="tot">' + prev + '</td><td class="tot">' + (prev + c.P) + '</td>' +
              '<td class="tot">' + (pct === null ? '—' : pct + '%') + '</td></tr>';
          });
          html += '</table>';
        });
        html += '</body></html>';
        return html;
      }

      function download(name, blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
      }
      document.getElementById('btnExcel').addEventListener('click', function () {
        var blob = new Blob(['\ufeff' + registerDoc(reg(), false)], { type: 'application/vnd.ms-excel' });
        download('attendance-register-backup.xls', blob);
        toast('Excel backup downloaded');
      });
      document.getElementById('btnPdf').addEventListener('click', function () {
        var blob = new Blob([registerDoc(reg(), true)], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        var w = window.open(url, '_blank');
        if (w) { toast('Register opened — choose "Save as PDF" in the print options'); }
        else { toast('Popup blocked — please allow popups for this page, then try again'); }
      });

      /* ---------- init ---------- */
      function renderAll() { renderHeader(); renderMark(); renderMonth(); renderStudents(); }
      renderAll();
    })();
    </script>
  </body>
</html>
